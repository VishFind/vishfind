<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Контакты — VishFind</title>
  <meta name="description" content="Контакты проекта VishFind."/>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml"/>
  <script>
    (function () {
      try {
        var s = localStorage.getItem('isearch-theme');
        var t = s || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css"/>
  <link rel="stylesheet" href="css/site.css"/>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap glass">
      <a class="brand" href="/">VishFind</a>
      <div class="header-right">
        <nav class="nav" aria-label="Основное">
          <a href="/">Поиск</a>
          <a href="/about.html">О проекте</a>
          <a href="/contacts.html" aria-current="page">Контакты</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle">Тема</button>
      </div>
    </div>
  </header>
  <main class="page">
    <div class="wrap">
      <h1>Контакты</h1>
      <p>По вопросам работы сервиса, ошибкам разбора и предложениям по площадкам пишите на почту.</p>
      <p class="vf-contact">Почта: <a href="mailto:YOUR_EMAIL@example.com">YOUR_EMAIL@example.com</a></p>
      <p class="muted">Замените адрес в файле <code>contacts.html</code> на рабочий перед публикацией.</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>VishFind · ранняя версия</span>
      <span><a href="/">Поиск</a> · <a href="/about.html">О проекте</a></span>
    </div>
  </footer>
  <script src="js/theme.js" defer></script>
</body>
</html>
